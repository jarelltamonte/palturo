<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#262626">
  <title>Page not found · PalTuro</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f7f2;
      color: #262626;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      background: #fff;
      border: 1px solid #e4e4dc;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .08);
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f0ff5a;
      color: #262626;
      font-size: 28px;
      font-weight: 800;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 24px; color: #666; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      background: #c6f10a;
      color: #262626;
      font-weight: 700;
      text-decoration: none;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #f2f2f2; }
      main { background: #2a2a2a; border-color: #3a3a3a; }
      p { color: #b9b9b9; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">P</div>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a href="/">Open PalTuro</a>
  </main>
</body>
</html>

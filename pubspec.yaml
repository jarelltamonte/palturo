name: palturo
description: "A mobile application for community-based Filipino cultural skill exchange."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  image_picker: ^1.1.2

  flutter_svg: ^2.0.0
  flutter_otp_text_field: ^1.1.0+2
  lottie: ^3.1.2
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  android: true
  ios: true
  web: true

  color: "#FFFFFF"
  image: "assets/images/slogo_black.png"
  branding: "assets/images/brand.png"

  color_dark: "#262626"
  image_dark: "assets/images/slogo_white.png"
  branding_dark: "assets/images/brand.png"

  fullscreen: false
  branding_mode: bottom

  android_12:
      color: "#FFFFFF"
      color_dark: "#262626"
      image: "assets/images/slogo_black.png"
      image_dark: "assets/images/slogo_white.png"
      branding: "assets/images/brand.png"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/rlogo.png"

  adaptive_icon_background: "#262626"
  adaptive_icon_foreground: "assets/images/rlogo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa/Comfortaa-Regular.ttf
        - asset: assets/fonts/Comfortaa/Comfortaa-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/Inter_18pt-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700

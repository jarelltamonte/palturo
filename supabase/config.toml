project_id = "palturo"

[auth]
site_url = "http://localhost:5317"
jwt_expiry = 1800
additional_redirect_urls = ["http://localhost:5317", "http://localhost:5317/**", "palturo://auth/callback", "palturo://auth/reset-callback"]

[auth.email]
enable_confirmations = true

[functions.moderate-notes]
verify_jwt = false

[functions.get-matches]
verify_jwt = true

[functions.generate-embeddings]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

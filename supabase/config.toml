project_id = "palturo"

[auth]
site_url = "https://palturo.app"
jwt_expiry = 1800
additional_redirect_urls = ["http://localhost:5317", "http://localhost:5317/**", "https://palturo.app/**", "https://www.palturo.app/**"]

[auth.email]
enable_confirmations = true

[functions.classify-skill]
verify_jwt = true

[functions.moderate-notes]
verify_jwt = false

[functions.get-matches]
verify_jwt = true

[functions.generate-embeddings]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

  <script id="seo-title-guard">
    // Flutter's MaterialApp.title sets document.title to the short brand name
    // at runtime. Keep the descriptive SEO title for the browser tab and for
    // crawlers that render JavaScript. This is a web-shell guard; app code is
    // unchanged.
    (function () {
      var seoTitle = 'PalTuro — Community Skill Exchange in the Philippines';
      function restoreTitle() {
        if (document.title !== seoTitle) document.title = seoTitle;
      }
      try {
        new MutationObserver(restoreTitle).observe(document.head, {
          childList: true,
          subtree: true,
          characterData: true,
        });
      } catch (_) {}
      restoreTitle();
    })();
  </script>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <script id="fresh-build-script">
    // Flutter web can keep an old bundle alive through an installed service
    // worker or CacheStorage. Drop both before the engine boots so a deployed
    // build is never masked by a previous one.
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          });
        }
      } catch (_) {}
    })();
  </script>
